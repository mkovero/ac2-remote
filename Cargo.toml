[package]
name = "ac2-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ac2-client = { path = "/work/ac2-pin/684d610/crates/ac2-client" }
ac2-proto = { path = "/work/ac2-pin/684d610/crates/ac2-proto" }
ac2-zmq = { path = "/work/ac2-pin/684d610/crates/ac2-zmq" }
ac2-scene = { path = "/work/ac2-pin/684d610/crates/ac2-scene" }
ac2-plot = { path = "/work/ac2-pin/684d610/crates/ac2-plot" }
ac2-discovery = { path = "/work/ac2-pin/684d610/crates/ac2-discovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui-wgpu = "=0.36.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "=0.22.4"
ndk-context = "0.1"
eframe = { version = "=0.36.2", default-features = false, features = ["android-native-activity"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wayland", "x11"] }

[dev-dependencies]
ac2-client = { path = "/work/ac2-pin/684d610/crates/ac2-client", features = ["test-support"] }
tempfile = "3"

[package.metadata.android]
package = "fi.mui.ac2remote"
apk_name = "ac2-remote"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[package.metadata.android.application]
label = "ac2 Remote"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden"

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = "debuginfo"
